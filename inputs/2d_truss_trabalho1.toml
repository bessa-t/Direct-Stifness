# Truss example (trabalho_1, exercise I): 2D truss, same data as the hand calculation
# Units: kN and m
# Global axes: x to the right, y up

structure = "2d_truss"

[materials]
steel = { E = 180e6, v = 0.3 }    # E [kN/m2] (180 GPa), v [-]

[sections]
sec_1 = { A = 5.0e-3 }            # A [m2]

[mesh]
default_material = "steel"
default_section = "sec_1"

# Node i is the i-th line. Coordinates: x, y
nodes = [
    [0.0, 0.0],                    # node 1
    [2.0, 0.0],                    # node 2
    [4.0, 0.0],                    # node 3
    [1.0, 1.7320508075688772],     # node 4
    [3.0, 1.7320508075688772],     # node 5
]

# Element k is the k-th line. Node i, node j
elements = [
    [1, 2],   # element 1
    [2, 3],   # element 2
    [1, 4],   # element 3
    [4, 2],   # element 4
    [2, 5],   # element 5
    [5, 3],   # element 6
    [4, 5],   # element 7
]

# node, ux, uy  (prescribed displacement in m)
#   0.0 = locked | nan = free | any other value = settlement
boundary = [
    [1, 0.0, 0.0],   # node 1: pinned
    [3, 0.0, 0.0],   # node 3: pinned
]

[loads]
# node, Fx, Fy [kN]
nodal_loads = [
    [4, 10.0, 0.0],   # P = 10 kN to the right at node 4
]
